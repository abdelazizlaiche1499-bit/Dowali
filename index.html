<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Image Switch</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      font-family: Arial, sans-serif;
    }

    .image-box {
      width: 50vw;
      height: 50vh;
      min-width: 300px;
      min-height: 300px;

      display: flex;
      justify-content: center;
      align-items: center;

      cursor: pointer;
      transition: 0.4s ease;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;

      border-radius: 15px;
      transition: 0.5s ease;

      box-shadow: 0 0 30px rgba(255,255,255,0.25);
    }

    /* الصورة الثانية */
    .image-box.circle {
      width: 55vh;
      height: 55vh;
    }

    .image-box.circle img {
      width: 100%;
      height: 100%;

      object-fit: cover;
      border-radius: 50%;

      border: 8px solid white;

      box-shadow:
        0 0 20px rgba(255,255,255,0.5),
        0 0 60px rgba(255,255,255,0.25);
    }

    @media (max-width: 600px) {
      .image-box {
        width: 90vw;
        height: 50vh;
      }

      .image-box.circle {
        width: 80vw;
        height: 80vw;
      }
    }
  </style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4b6cb7">
<link rel="apple-touch-icon" href="icon.png"></head>

<body>

  <div class="image-box" id="imageBox" onclick="changeImage()">

    <!-- الصورة الأولى -->
    <img id="mainImage" src="1000160480.png" alt="Image">

  </div>

  <script>

    let secondImage = false;

    function changeImage() {

      const image = document.getElementById("mainImage");
      const box = document.getElementById("imageBox");

      if (!secondImage) {

        // تغيير للصورة الثانية
        image.src = "1000161541.png";

        // تحويلها إلى دائرة كبيرة
        box.classList.add("circle");

        secondImage = true;

      } else {

        // الرجوع للصورة الأولى
        image.src = "1000160480.png";

        // إزالة الدائرة
        box.classList.remove("circle");

        secondImage = false;
      }
    }

  </script>


<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));}</script>
</body>
</html>
